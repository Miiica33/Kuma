services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kuma-backend
    ports:
      - "8000:8000"
    environment:
      - VOLCANO_API_KEY=${VOLCANO_API_KEY}
      - VOLCANO_API_ENDPOINT=${VOLCANO_API_ENDPOINT:-https://api.volcengine.com}
      - WS_HOST=0.0.0.0
      - WS_PORT=8000
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kuma-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
